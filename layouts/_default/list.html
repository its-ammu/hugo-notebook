{{ define "main" }}
<section class="list-page">
  <h1 class="list-title">{{ .Title }}</h1>
  {{ if .Content }}
    <div class="ruled post-content">
      {{ .Content }}
      {{ partial "content-end.html" . }}
    </div>
  {{ end }}

  <div class="card-grid">
    {{ range .Pages }}
      {{ partial "post-card.html" . }}
    {{ end }}
  </div>
</section>
{{ end }}
